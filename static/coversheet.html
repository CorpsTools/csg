	<div class=WordSection1 id="cshtml">

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>

<script type="text/javascript" src="vendor/html2canvas.min.js"></script>

	<script type="text/javascript">
		let gotResponse = false;

		const opt = {
			margin:       0,
			filename:     'coversheet.pdf',
			image:        { type: 'jpeg', quality: 1 },
			html2canvas:  { scale: 1, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.clientWidth },
			jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
		};

		function updatePageDimensions() {
			const pageWidth = document.documentElement.clientWidth;
			const root = document.documentElement;
			root.style.setProperty('--page-width', `${pageWidth}px`);
			root.style.setProperty('--page-height', `${pageWidth * 11 / 8.5}px`);
			root.style.setProperty('--page-font-size', `${pageWidth * 12 / 612}px`);
		}

		updatePageDimensions();
		window.addEventListener('resize', updatePageDimensions);

		document.addEventListener('paste', async (e) => {
			e.preventDefault();
			const clipboardItems = typeof navigator?.clipboard?.read === 'function' ? await navigator.clipboard.read() : e.clipboardData.files;

			for (const clipboardItem of clipboardItems) {
				let blob;
				if (clipboardItem.type && clipboardItem.type.startsWith('image/')) {
					// For files from `e.clipboardData.files`.
					blob = clipboardItem;
					// Do something with the blob.
				} else {
					// For files from `navigator.clipboard.read()`.
					const imageTypes = clipboardItem.types ? clipboardItem.types.filter(type => type.startsWith('image/')) : [];
					for (const imageType of imageTypes) {
						blob = await clipboardItem.getType(imageType);
						// Do something with the blob.
					}
				}

				if(blob) {
					const base64 = await blobToBase64(blob);

					window.postMessage({
						custom: true,
						image: base64
					});
				}
			}
		});

		function blobToBase64(blob) {
			return new Promise((resolve, _) => {
				const reader = new FileReader();
				reader.onloadend = () => resolve(reader.result);
				reader.readAsDataURL(blob);
			});
		}

		function updateCoversheetText(state) {
			const isGroup = state.cadets.length > 1;
			const subjectPronoun = isGroup ? 'We' : 'I';
			const objectPronoun = isGroup ? 'we' : 'I';
			const selectedInitials = state.initials.filter(Boolean).join(' ');
			const usedInitials = state.certificationOption === 'used' && selectedInitials ? selectedInitials : '_____';
			const unusedInitials = state.certificationOption === 'unused' && selectedInitials ? selectedInitials : '_____';
			const positions = isGroup ? {
				title: 21.6414, course: 30.3535, section: 33.8384, instructor: 37.3232,
				by: 44.2929, cadets: 47.7778, location: 53.0051, date: 56.4899,
				used: 65.2020, unused: 72.1717, signature: 80.8838
			} : {
				title: 23.3838, course: 35.5808, section: 39.0657, instructor: 42.5505,
				by: 53.0051, cadets: 56.4899, location: 59.9747, date: 63.4596,
				used: 75.6566, unused: 80.8838, signature: 87.8535
			};
			const signatureRows = state.cadets.map((_, index) => `
				<p class="cover-line signature-row" style="top:${positions.signature + index * 1.7424}%">
					<span>SIGNATURE:</span><span class="signature-line"></span><span>DATE:</span><span class="signature-date-line">${state.signatureDate || ''}</span>
				</p>`).join('');
			let csHTML = `
				<p class="cover-line cover-center" style="top:12.9293%">UNITED STATES MILITARY ACADEMY</p>
				<p class="cover-line cover-center" style="top:${positions.title}%">${state.assignmentName}</p>
				${state.endTextPositionUnderTitle && state.endText ? `<p class="cover-line cover-center" style="top:${positions.title + 2.2}%">${state.endText}</p>` : ''}
				<p class="cover-line cover-center" style="top:${positions.course}%">${state.course}</p>
				<p class="cover-line cover-center" style="top:${positions.section}%">${state.section}</p>
				<p class="cover-line cover-center" style="top:${positions.instructor}%">${state.instructor}</p>
				<p class="cover-line cover-center" style="top:${positions.by}%">BY</p>
				<div class="cover-line cover-center" style="top:${positions.cadets}%; line-height:1.15">${state.cadets.join('<br>')}</div>
				<p class="cover-line cover-center" style="top:${positions.location}%">WEST POINT, NEW YORK</p>
				<p class="cover-line cover-center" style="top:${positions.date}%">${state.date}</p>
				<p class="cover-line certification" style="top:${positions.used}%"><span class="initial-block">${usedInitials}</span> ${subjectPronoun} certify that ${objectPronoun} have completely documented all sources and acknowledged all assistance ${objectPronoun} received, <b>to include the use of generative AI,</b> in the completion of this assignment.</p>
				<p class="cover-line certification" style="top:${positions.unused}%"><span class="initial-block">${unusedInitials}</span> ${subjectPronoun} certify that ${objectPronoun} did not use any sources or receive any assistance requiring documentation or acknowledgement, <b>to include the use of generative AI,</b> in the completion of this assignment.</p>
				${signatureRows}
				${!state.endTextPositionUnderTitle && state.endText ? `<p class="cover-line" style="top:91%">${state.endText}</p>` : ''}
			`;

			document.querySelector('#cshtml').innerHTML = csHTML;
		}

		function getClipboardPayload() {
			const coversheet = document.querySelector('#cshtml');
			const pageRect = coversheet.getBoundingClientRect();
			const pointsPerPixel = 792 / pageRect.height;
			const wordPageStart = 72;
			let cursor = wordPageStart;
			const lines = Array.from(coversheet.querySelectorAll('.cover-line'))
				.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);

			const wordRows = lines.map(line => {
				const rect = line.getBoundingClientRect();
				const top = (rect.top - pageRect.top) * pointsPerPixel;
				const height = rect.height * pointsPerPixel;
				const gap = Math.max(0, top - cursor);
				cursor = Math.max(cursor, top + height);
				const spacerRow = gap > 0.1
					? `<tr height="${gap.toFixed(2)}" style="height:${gap.toFixed(2)}pt;mso-height-source:userset;"><td style="height:${gap.toFixed(2)}pt;padding:0;border:0;font-size:1pt;line-height:1pt;">&nbsp;</td></tr>`
					: '';

				if (line.classList.contains('signature-row')) {
					const date = line.querySelector('.signature-date-line')?.textContent || '';
					return `${spacerRow}<tr style="height:${height.toFixed(2)}pt;"><td style="height:${height.toFixed(2)}pt;padding:0;border:0;vertical-align:top;"><table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:collapse;table-layout:fixed;width:468pt;margin:0;mso-table-lspace:0pt;mso-table-rspace:0pt;font-family:'Times New Roman',serif;font-size:12pt;line-height:13.8pt;"><tr><td style="width:71.28pt;padding:0;white-space:nowrap;">SIGNATURE:</td><td style="width:180.12pt;padding:0;border-bottom:1pt solid #000;">&nbsp;</td><td style="width:35.28pt;padding:0;white-space:nowrap;">DATE:</td><td style="width:3pt;padding:0;"></td><td style="width:156pt;padding:0;border-bottom:1pt solid #000;text-align:center;white-space:nowrap;">${date || '&nbsp;'}</td><td style="width:22.32pt;padding:0;"></td></tr></table></td></tr>`;
				}

				const alignment = line.classList.contains('cover-center') ? 'center' : 'left';
				const content = line.innerHTML.replace(
					/class="initial-block"/g,
					`style="display:inline-block;white-space:nowrap;"`
				);
				return `${spacerRow}<tr style="height:${height.toFixed(2)}pt;"><td style="height:${height.toFixed(2)}pt;padding:0;border:0;vertical-align:top;text-align:${alignment};font-family:'Times New Roman',serif;font-size:12pt;line-height:13.8pt;">${content}</td></tr>`;
			}).join('');

			return {
				text: coversheet.innerText,
				html: `<!doctype html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><body style="margin:0;padding:0;"><table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:collapse;table-layout:fixed;width:468pt;margin:0;mso-table-lspace:0pt;mso-table-rspace:0pt;font-family:'Times New Roman',serif;font-size:12pt;line-height:13.8pt;">${wordRows}</table></body></html>`
			};
		}

		window.addEventListener("message", async (event) => {
			if(typeof event.data !== 'object' || !event.data.custom) return;

			if(event.data.copyToClipboard) {
				selectText('body');
				document.execCommand('copy');
				setTimeout(() => {
					clearSelection();
				}, 10);
				function clearSelection(){
					if (window.getSelection) {window.getSelection().removeAllRanges();}
					else if (document.selection) {document.selection.empty();}
				}
				function selectText(selector) {
					const node = document.querySelector(selector);

					if (document.body.createTextRange) {
						const range = document.body.createTextRange();
						range.moveToElementText(node);
						range.select();
					} else if (window.getSelection) {
						const selection = window.getSelection();
						const range = document.createRange();
						range.selectNodeContents(node);
						selection.removeAllRanges();
						selection.addRange(range);
					} else {
						console.warn("Could not select text in node: Unsupported browser.");
					}
				}
			} else if(event.data.getCoversheetImage) {
				document.body.scrollTop = 0;
				document.body.classList.add('printing');
				let data = await html2pdf().set({
					margin:       0,
					image:        { type: 'png', quality: 1 },
					html2canvas:  { scale: 3, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.clientWidth },
					jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
				}).from(document.body).outputImg('datauristring');

				document.body.classList.remove('printing');
				let blob = dataURItoBlob(data);
				// console.log(data, blob);
				event.source.postMessage({
					custom: true,
					return_image: blob
				}, window.location.origin);
			} else if(event.data.image) {
				const div = document.createElement("div");
				const randomClass = "drag" + Math.random().toString().slice(3);

				const loadedImage = await base64ImageDataToImage(event.data.image);
				div.style.width = `${loadedImage.width}px`;
				div.style.height = `${loadedImage.height}px`;

				div.innerHTML = `<img src="${event.data.image}" />`;
				document.body.prepend(div);
				div.style.position = "fixed";
				// div.style.top = '50px';
				// div.style.left = '100px';
				div.classList.add(randomClass);
				div.classList.add('drag-img');

				div.oncontextmenu = event => {
					div.remove();
					event.preventDefault();
				};
				
				interact(`.${randomClass}`)
					.resizable({
						// resize from all edges and corners
						edges: { left: true, right: true, bottom: true, top: true },

						listeners: {
							move (event) {
								let target = event.target
								let x = (parseFloat(target.getAttribute('data-x')) || 0)
								let y = (parseFloat(target.getAttribute('data-y')) || 0)

								// update the element's style
								target.style.width = event.rect.width + 'px';
								target.style.height = event.rect.height + 'px';

								// translate when resizing from top or left edges
								target.style.transform = 'translate(' + x + 'px,' + y + 'px)'

								target.setAttribute('data-x', x);
								target.setAttribute('data-y', y);
							}
						},
						modifiers: [
							// keep the edges inside the parent
							// interact.modifiers.restrictEdges({
							// 	outer: 'parent'
							// }),

							// minimum size
							interact.modifiers.restrictSize({
								min: { width: 25, height: 25 }
							})
						]
					})
					.draggable({
						listeners: { move: dragMoveListener },
						modifiers: [
							// interact.modifiers.restrictRect({
							// 	restriction: 'parent',
							// 	endOnly: true
							// })
						]
					})
			} else if(event.data.getPDF) {
				document.body.scrollTop = 0;
				(async () => {
					// New Promise-based usage:
					document.body.classList.add('printing');
					event.source.postMessage({
						custom: true,
						pdf: await html2pdf().set(opt).from(document.body).output('blob')
					}, window.location.origin);
					document.body.classList.remove('printing');
				})();
			} else if(event.data.state) {
				updateCoversheetText(event.data.state);
				event.source.postMessage({
					custom: true,
					clipboardPayload: getClipboardPayload()
				}, event.origin || '*');
				gotResponse = true;
			}
		});
		function dragMoveListener (event) {
			let target = event.target
			// keep the dragged position in the data-x/data-y attributes
			let x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx
			let y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy

			// translate the element
			target.style.transform = 'translate(' + x + 'px, ' + y + 'px)'

			// update the posiion attributes
			target.setAttribute('data-x', x)
			target.setAttribute('data-y', y)
		}

		function base64ImageDataToImage(base64) {
			return new Promise(resolve => {
				const image = new Image();

				image.onload = () => {
					resolve(image);
				};

				image.src = base64;
			});
		}

		function dataURItoBlob(dataURI) {
			// convert base64 to raw binary data held in a string
			// doesn't handle URLEncoded DataURIs - see SO answer #6850276 for code that does this
			const byteString = atob(dataURI.split(',')[1]);

			// separate out the mime component
			const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0]

			// write the bytes of the string to an ArrayBuffer
			const ab = new ArrayBuffer(byteString.length);

			// create a view into the buffer
			let ia = new Uint8Array(ab);

			// set the bytes of the buffer to the correct values
			for (let i = 0; i < byteString.length; i++) {
				ia[i] = byteString.charCodeAt(i);
			}

			// write the ArrayBuffer to a blob, and you're done
			const blob = new Blob([ab], {type: mimeString});
			return blob;
		}

		let readyInterval;
		readyInterval = setInterval(() => {
			window.parent.postMessage({
				custom: true,
				csReady: true
			});

			if(gotResponse) {
				clearInterval(readyInterval);
			}
		}, 500);
	</script>
